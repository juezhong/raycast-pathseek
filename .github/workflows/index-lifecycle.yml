name: PathSeek quality gates

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/index-lifecycle.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  pull_request:
    paths:
      - "scripts/**"
      - "package-lock.json"
      - "src/**"
      - "tests/**"
      - ".github/workflows/index-lifecycle.yml"
      - "package.json"
      - "tsconfig.json"

jobs:
  verify:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install locked npm dependencies
        run: npm ci --no-audit --no-fund
      - name: Install fd and fzf for real-scanner and search integration tests
        run: |
          command -v fd || brew install fd
          command -v fzf || brew install fzf
      - name: Index format and atomic-publish tests
        run: npm test
      - name: Raycast build (generates preference types)
        run: npm run build
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Source ESLint (independent of Store account validation)
        run: npm run lint:code
      - name: Prettier source format check
        run: npm run format:check
