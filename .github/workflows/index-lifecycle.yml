name: PathSeek quality gates

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/index-lifecycle.yml"
      - "package.json"
      - "tsconfig.json"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/index-lifecycle.yml"
      - "package.json"
      - "tsconfig.json"

permissions:
  contents: write

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Record generated lockfile on PR branch (one-time bootstrap)
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/stable-index-file-atomic-swap'
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: pin npm dependency tree with package-lock.json"
          git push origin HEAD:fix/stable-index-file-atomic-swap
      - name: Export generated npm lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: pathseek-npm-lockfile
          path: package-lock.json
          retention-days: 7
      - name: Install fd for real-scan integration tests
        run: command -v fd || brew install fd
      - name: Index format and atomic-publish tests
        run: npm test
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Source ESLint (independent of Store account validation)
        run: npm run lint:code
      - name: Raycast build
        run: npm run build
      # Raycast's full lint also validates the extension's Store author.
      # The owner will provide their Raycast username at publication time.
      # Keep the result visible without blocking the developer-only CI.
      - name: Store metadata and formatting audit (publication gate)
        continue-on-error: true
        run: npm run lint
