name: Index lifecycle tests

on:
  push:
    paths:
      - "src/lib/index-files.ts"
      - "tests/index-files.test.mjs"
      - ".github/workflows/index-lifecycle.yml"
      - "package.json"
  pull_request:
    paths:
      - "src/lib/index-files.ts"
      - "src/lib/index-store.ts"
      - "tests/index-files.test.mjs"
      - ".github/workflows/index-lifecycle.yml"
      - "package.json"

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Index lifecycle regression tests
        run: npm test
