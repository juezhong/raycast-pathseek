name: PathSeek quality gates

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/index-lifecycle.yml"
      - "package.json"
      - "tsconfig.json"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/index-lifecycle.yml"
      - "package.json"
      - "tsconfig.json"

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Index format and atomic-publish tests
        run: npm test
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Raycast lint
        run: npm run lint
      - name: Raycast build
        run: npm run build
