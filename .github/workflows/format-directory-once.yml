name: One-time format directory matcher feature
on:
  push:
    branches: [feat/fzf-compatible-directory-matchers]
    paths:
      - ".github/workflows/format-directory-once.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format updated source and tests
        run: |
          npm run format
          npx prettier --write tests/fuzzy-path-query.test.mjs tests/fzf-lifecycle.test.mjs scripts/benchmark-path-search.mjs
      - name: Commit formatting
        run: |
          if ! git diff --quiet -- src tests scripts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests scripts
            git commit -m "style: format directory search and benchmark implementation"
            git push origin HEAD:feat/fzf-compatible-directory-matchers
          fi
