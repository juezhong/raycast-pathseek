name: Format PathSeek source once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-pathseek-source-once.yml"

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply Raycast Prettier 3.9.10 to source only
        run: npx --yes prettier@3.9.10 --write "src/**/*.{ts,tsx}"
      - name: Commit source-only format changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "Already formatted"
          else
            git commit -m "style: apply Raycast Prettier 3.9.10 formatting to source"
            git push origin HEAD:main
          fi
