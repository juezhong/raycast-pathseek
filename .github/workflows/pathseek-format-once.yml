name: One-time PathSeek code formatting
on:
  push:
    branches: [feat/native-fzf-path-always-pinyin]
    paths:
      - ".github/workflows/pathseek-format-once.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/lib/fuzzy-path-query.ts src/lib/fzf-runner.ts src/lib/pinyin-filter.ts src/lib/fzf-pinyin-priority.ts src/search-guides.tsx
      - name: Commit format-only update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/fuzzy-path-query.ts src/lib/fzf-runner.ts src/lib/pinyin-filter.ts src/lib/fzf-pinyin-priority.ts src/search-guides.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to updated search sources"
            git push origin HEAD:feat/native-fzf-path-always-pinyin
          fi
