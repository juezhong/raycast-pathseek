name: Format one-time search-pinyin fix

on:
  push:
    branches:
      - fix/general-pinyin-matching-and-search-hints
    paths:
      - ".github/workflows/format-one-time-pinyin.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: |
          npm run format
          npx prettier --write tests/fzf-lifecycle.test.mjs tests/fzf-pinyin-priority.test.mjs
      - name: Commit formatted sources and tests
        run: |
          if ! git diff --quiet -- src tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: format pinyin priority output and search hints"
            git push origin HEAD:fix/general-pinyin-matching-and-search-hints
          fi
