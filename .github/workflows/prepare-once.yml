name: One-time dependency lock and formatting

on:
  push:
    branches:
      - feat/fzf-help-query-preview-pinyin
    paths:
      - ".github/workflows/prepare-once.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve runtime dependency into package-lock
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Format source and tests
        run: |
          npm run format
          npx prettier --write tests/pinyin-filter.test.mjs tests/fzf-lifecycle.test.mjs
      - name: Commit generated files
        run: |
          if ! git diff --quiet -- package-lock.json src/ tests/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json src/ tests/
            git commit -m "build: lock pinyin dependency and format implementation"
            git push origin HEAD:feat/fzf-help-query-preview-pinyin
          fi
