name: Remove merged P5 branch (one time)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-p5-branch-once.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete P5 branch only after PR #13 merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          merged="$(gh api "repos/$repo/pulls/13" --jq .merged)"
          if [[ "$merged" != "true" ]]; then
            echo "PR 13 is not merged; refusing cleanup"
            exit 1
          fi
          branch="chore/p5-onboarding-and-release-notes"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git push origin --delete "$branch"
          fi
          echo "PR 13 branch cleanup complete"
