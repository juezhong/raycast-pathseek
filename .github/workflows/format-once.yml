name: One-shot safety review formatter

on:
  push:
    branches:
      - fix/one-shot-resource-lifecycle
    paths:
      - ".github/workflows/format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Format reviewed sources
        run: |
          npm run format
          if ! git diff --quiet -- src; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "style: normalize memory and child lifecycle formatting"
            git push origin HEAD:fix/one-shot-resource-lifecycle
          fi
