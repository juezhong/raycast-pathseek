# One-time release tagging job. Remove this workflow after v0.1.0 exists.
# Uses the frozen, previously verified main commit; never moves an existing tag.
name: Create PathSeek v0.1.0 stable Git tag (one time)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/create-pathseek-stable-tag-once.yml"

permissions:
  contents: write

jobs:
  tag-verified-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create annotated stable snapshot tag
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.1.0"
          sha="9cf81375c059762f22c2d7973b25f302337a6155"
          git fetch origin "$sha"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag already exists; refusing to change it"
            exit 0
          fi
          test "$(git cat-file -t "$sha")" = commit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$sha" -m "PathSeek v0.1.0 — macOS-verified stable development baseline" -m "Verified: manual fd index, fzf search, Finder actions, Open/Save path paste and selection; release/Store review is separate."
          git push origin "refs/tags/$tag"
