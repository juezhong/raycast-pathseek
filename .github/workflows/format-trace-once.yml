name: Format filename search and trace changes once

on:
  push:
    branches:
      - fix/local-trace-view-and-filename-only-search
    paths:
      - ".github/workflows/format-trace-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Format updated source and tests
        run: |
          npm run format
          npx prettier --write tests/pinyin-filter.test.mjs tests/fzf-lifecycle.test.mjs tests/trace-view.test.mjs
      - name: Commit formatting
        run: |
          if ! git diff --quiet -- src tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: format basename matching and trace display"
            git push origin HEAD:fix/local-trace-view-and-filename-only-search
          fi
